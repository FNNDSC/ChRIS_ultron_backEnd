# PostgreSQL configuration for CUBE's development and benchmark stacks.
#
# docker-compose.yml mounts this directory at /etc/postgresql and starts the db service
# with `postgres -c config_file=/etc/postgresql/cube.conf`; docker-compose.benchmark.yml
# repeats that command line and adds max_connections and synchronous_commit to it. This
# file therefore *replaces* the postgresql.conf that initdb wrote into the data directory:
# a setting missing here takes PostgreSQL's built-in default, not the image's. The data
# directory's postgresql.auto.conf (ALTER SYSTEM) is still read after this file and wins.
#
# Existing db volumes pick it up on the next start. After editing it, restart the whole
# stack (`just down && just up`, or `just bench-down && just bench-start`), not db alone:
# CUBE's connection pools would keep the connections the restart closed, and each would fail
# a request. shared_buffers, shared_preload_libraries, listen_addresses and
# dynamic_shared_memory_type change only at server start, the others also on SELECT
# pg_reload_conf(). The file must stay readable by the container's postgres user (uid 999):
# mode 0644, in a directory others can enter.
#
# Sizes come from the benchmark's db limit (4 GB of memory, 2 CPUs, NVMe storage), which
# is also a reasonable laptop budget. Sizing a production deployment is out of scope here.

#------------------------------------------------------------------------------
# Kept from the postgresql.conf the postgres image's initdb writes
#------------------------------------------------------------------------------

listen_addresses = '*'                  # the built-in localhost would refuse the other
                                        # containers
dynamic_shared_memory_type = posix
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# Time zone
#------------------------------------------------------------------------------

# Django connects in UTC (USE_TZ) and compares the server's TimeZone as a string: any other
# spelling, including the image's Etc/UTC, makes it run set_config('TimeZone', 'UTC') on
# every new connection.
timezone = 'UTC'
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# Memory
#------------------------------------------------------------------------------

shared_buffers = 1GB                    # 25% of 4 GB
effective_cache_size = 3GB              # 75%: shared_buffers plus the page cache
work_mem = 32MB                         # per sort or hash: file-table sorts of a 100k-file
                                        # output stay in memory. Parallel hash joins put up
                                        # to 3 × 2 × this in /dev/shm, which is why
                                        # docker-compose.yml sets shm_size on db.
maintenance_work_mem = 512MB            # vacuum and index builds on the file table

#------------------------------------------------------------------------------
# WAL and checkpoints
#------------------------------------------------------------------------------

# A checkpoint is requested once the WAL since the last one reaches about
# max_wal_size / (1 + checkpoint_completion_target), ~4.2 GB here; each checkpoint makes
# the next change to every page write a full-page image again. At the default 1 GB a deep
# DAG's registrations forced a checkpoint every few minutes.
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = lz4                   # full-page images; lz4 costs far less CPU than
                                        # pglz (`on`) on a 2-CPU db

#------------------------------------------------------------------------------
# Planner and IO (SSD/NVMe rather than rotating disks)
#------------------------------------------------------------------------------

random_page_cost = 1.1
effective_io_concurrency = 200          # bounded by PostgreSQL 18's io_max_concurrency

#------------------------------------------------------------------------------
# Instrumentation
#------------------------------------------------------------------------------

shared_preload_libraries = 'pg_stat_statements'   # the benchmark's per-scenario query
                                                  # attribution (CREATE EXTENSION to use it)
track_io_timing = on
log_min_duration_statement = 1s         # bulk INSERTs are logged with every value inlined
                                        # (Django binds parameters client side)
log_lock_waits = on

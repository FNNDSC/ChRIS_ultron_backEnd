# Coverage configuration.
# Kept in setup.cfg rather than .coveragerc because .coveragerc is excluded
# from the Docker image via .dockerignore, so it is unavailable during CI runs.

[coverage:run]
source =
    collectionjson
    core
    dicomweb
    feeds
    filebrowser
    pacsfiles
    pipelines
    plugininstances
    plugins
    userfiles
    users
    workflows
omit =
    */migrations/*
    */tests/*

[coverage:report]
show_missing = True
skip_empty = True
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError

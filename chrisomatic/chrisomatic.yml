version: 1.2

on:
  cube_url: http://chrisdev.local:8000/api/v1/
  chris_superuser:
    username: chris
    password: chris1234

cube:
  users:
    - username: cube
      password: cube1234
      email: cube@babymri.org

  compute_resource:
    - name: host
      url: "http://pfcon.remote:30005/api/v1/"
      username: pfcon
      password: pfcon1234
      description: host Description

  # dbg-bigfiles, pl-simpledsapp and pl-topologicalcopy are the workload plugins required by the
  # CUBE benchmark harness (benchmarks/). Versions used for the recorded runs:
  #   dbg-bigfiles 1.0.0  ·  pl-simpledsapp 2.1.5  ·  pl-topologicalcopy 1.0.13
  # Adjust versions here as needed, but keep EXACTLY ONE version of each installed: the harness
  # resolves each plugin by name and runs CUBE's first match (plugins are ordered by -version),
  # so a second version of the same plugin silently changes which one runs.
  plugins:
    - name: pl-simplefsapp
    - name: pl-dircopy
    - name: pl-topologicalcopy
    - dock_image: fnndsc/pl-simpledsapp
    - dock_image: fnndsc/dbg-bigfiles
    - dock_image: fnndsc/pl-s3retrieve

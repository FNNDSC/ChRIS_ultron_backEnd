version: 1.2

on:
  cube_url: http://chrisdev.local:8000/api/v1/
  chris_superuser:
    username: chris
    password: chris1234

cube:
  users:
    - username: cube
      password: cube1234
      email: cube@babymri.org

  compute_resource:
    - name: host
      url: "http://pfcon.remote:30005/api/v1/"
      username: pfcon
      password: pfcon1234
      description: host Description

  # The benchmark harness (benchmarks/) does not use this file: `just bench-start` registers
  # its workload plugins at pinned versions from benchmarks/chrisomatic/benchmark.yml (see
  # benchmarks/envelope.md § "Pinned workload plugin versions").
  plugins:
    - name: pl-simplefsapp
    - name: pl-dircopy
    - name: pl-topologicalcopy
    - dock_image: fnndsc/pl-simpledsapp
    - dock_image: fnndsc/dbg-bigfiles
    - dock_image: fnndsc/pl-s3retrieve
